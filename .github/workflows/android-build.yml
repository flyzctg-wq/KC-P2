name: Android APK Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Signed Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Java (required by Gradle / Android build) ─────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install JS dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Write .env from GitHub Secrets (falls back to public defaults) ────
      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_APP_URL=https://kc-p2.vercel.app" >> .env

      # ── 7. Build Vite web bundle ──────────────────────────────────────────────
      - name: Build web bundle (Vite)
        run: npm run build

      # ── 8. Sync web → Android via Capacitor ──────────────────────────────────
      - name: Capacitor sync Android
        run: npx cap sync android

      # ── 9. Gradle permissions ─────────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── 10. Generate / restore signing keystore ───────────────────────────────
      - name: Decode keystore (from secret) or generate a fresh one
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret…"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/kunjachaya.keystore
          else
            echo "No KEYSTORE_BASE64 secret found – generating a one-time debug keystore…"
            keytool -genkey -v \
              -keystore android/app/kunjachaya.keystore \
              -alias kunjachaya \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass kunjachaya123 -keypass kunjachaya123 \
              -dname "CN=Kunjachaya Club, OU=Mobile, O=Kunjachaya, L=Chattogram, C=BD"
          fi

      # ── 11. Build unsigned release APK ────────────────────────────────────────
      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 12. Sign & zipalign ───────────────────────────────────────────────────
      - name: Sign Release APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/kunjachaya-aligned.apk"
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD || 'kunjachaya123' }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD || 'kunjachaya123' }}"
          $BUILD_TOOLS/zipalign -v -p 4 $UNSIGNED $ALIGNED || cp $UNSIGNED $ALIGNED
          $BUILD_TOOLS/apksigner sign \
            --ks android/app/kunjachaya.keystore \
            --ks-alias kunjachaya \
            --ks-pass pass:$KS_PASS \
            --key-pass pass:$KEY_PASS \
            --out Kunjachaya-Club.apk \
            $ALIGNED

      # ── 13. Compute version tag from short SHA ────────────────────────────────
      - name: Compute version tag
        id: ver
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y%m%d')
          echo "tag=v${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=Kunjachaya Club App — Build ${DATE} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      # ── 14. Upload APK as workflow artifact (30-day retention) ───────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kunjachaya-Club-APK-${{ steps.ver.outputs.tag }}
          path: Kunjachaya-Club.apk
          retention-days: 30

      # ── 15. Create / update GitHub Release with the APK ──────────────────────
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            ## 📱 Kunjachaya Club — Android APK

            **Built from commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Triggered by:** ${{ github.actor }}

            ### ✅ What's in this build
            - Functional bottom navigation bar (Dashboard, Members, Financials, Chat, Notices)
            - Full side drawer with all modules
            - Supabase authentication with pending approval flow
            - Kick-out system (Role & Permission Hierarchy — Articles 10, 14, 17)
            - Member Directory with direct Call, WhatsApp & email buttons
            - Blood Bank with emergency direct Call & WhatsApp (pre-filled message)
            - Invitation links now point to Vercel (not localhost)

            ### 📥 Installation
            1. Download `Kunjachaya-Club.apk` below
            2. Open it on your Android device
            3. Allow installation from unknown sources if prompted
          files: Kunjachaya-Club.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
