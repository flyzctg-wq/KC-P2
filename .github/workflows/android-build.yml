name: Android APK Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create .env file from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://rohbgdxkzlvbrvmckzeg.supabase.co' }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_tTOX1deF-abINLa7h50-Sw_e1QkuUuB' }}" >> .env

      - name: Build web bundle (Vite)
        run: npm run build

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/kunjachaya.keystore \
            -alias kunjachaya -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kunjachaya123 -keypass kunjachaya123 \
            -dname "CN=Kunjachaya Club, OU=Mobile, O=Kunjachaya, L=Chattogram, C=BD"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/kunjachaya-aligned.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/kunjachaya-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android/app/kunjachaya.keystore --ks-pass pass:kunjachaya123 --key-pass pass:kunjachaya123 --out Kunjachaya-Club.apk android/app/build/outputs/apk/release/kunjachaya-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kunjachaya-Club-APK
          path: Kunjachaya-Club.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Kunjachaya Club App (Latest APK)"
          body: "Official Android App for Kunjachaya Club. Download the direct .apk file below."
          files: Kunjachaya-Club.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
